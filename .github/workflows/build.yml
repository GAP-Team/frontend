name: Build and Test GAP FE App

on:
  push:
    branches:
      - main
      - developer
      - add-ci
  pull_request:
    branches:
      - main
      - developer

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # - name: Test
      #   run: npm run test
