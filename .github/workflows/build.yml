name: Build and Test GAP FE App

on:
  push:
    branches:
      - main
      - developer
      - add-ci
  pull_request:
    branches:
      - main
      - developer

jobs:
  install_dependencies:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

  build:
    runs-on: ubuntu-latest
    container:
      image: node:20
    needs: install_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    needs: install_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Test
        run: npm run test
