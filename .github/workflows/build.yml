name: Build and Test GAP FE App

on:
  push:
    branches:
      - main
      - developer
      - add-ci
  pull_request:
    branches:
      - main
      - developer

jobs:
  install_dependencies:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install
      - name: Persist node_modules
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

  build:
    runs-on: ubuntu-latest
    container:
      image: node:20
    needs: install_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    needs: install_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test
        run: npm run test
