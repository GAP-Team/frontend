name: GAP FE CI

on:
  push:
    branches:
      - developer

  pull_request:
    branches:
      - developer

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules

  build:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Set executable permissions for next binary
        run: chmod +x ./node_modules/next/dist/bin/next

      - name: Build
        run: npm run build:ci

  test:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Run tests
        run: npm run test

  deploy-to-vercel:
    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Set CI name
        run: git config --global user.name "gap-github-ci"
      
      - name: Set CI email
        run: git config --global user.email "gap-github-ci@gap.de"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: 'gap-next-fe'

      - name: Vercel Action
        # something is wrong with the latest version of the action, so we use a specific commit 
        # uses: amondnet/vercel-action@v25.1.1
        uses: amondnet/vercel-action@e610ddb0e844d1a22c4b27560c224f84f20f3061
        with:
          working-directory: /home/runner/work/gap-next-ts/gap-next-ts/gap-next-fe
          git-directory: gap-next-fe
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

