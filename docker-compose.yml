version: '3.7'

services:
  gap_frontend:
    container_name: gap_frontend
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app 
    networks:
      - gap_network
    environment:
      - NODE_ENV=development
    command: npm run dev

networks:
  gap_network:
